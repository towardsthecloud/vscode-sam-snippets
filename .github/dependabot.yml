version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      development-tooling:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      sam-validation-tooling:
        patterns: ['*']
    ignore:
      # aws-sam-cli caps cfn-lint (<1.59 as of 1.171.0); raise this when SAM does.
      - dependency-name: cfn-lint
        versions: ['>=1.59']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
