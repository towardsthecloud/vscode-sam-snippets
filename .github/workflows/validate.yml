name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - name: Validate the packaged extension in VS Code and SAM
        run: xvfb-run -a npm test
      - name: Retain the tested VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sam-snippets-vsix
          path: .test-artifacts/sam-snippets.vsix
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
      - name: Retain validation reports and expanded templates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports
          path: |
            .test-artifacts/*report.json
            .test-artifacts/expanded-snippets.json
            .test-artifacts/templates/*.yaml
            .test-artifacts/editor-logs/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
